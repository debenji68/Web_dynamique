<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>&nbsp;Pizzas....&nbsp;</legend>
            <p>Parmi la liste quelle est votre pizza préferée ? (un seul choix possible)</p>
            <div class="item_pizza">
                <input type="radio" id="marg" name="pizza" value="marguarita">
                <label for="marg">Marguarita</label>
            </div>
            <div class="item_pizza">
                <input type="radio" id="napo" name="pizza" value="napolitaine">
                <label for="napo">Napolitaine</label>
            </div>
            <div class="item_pizza">
                <input type="radio" id="rei" name="pizza" value="reine">
                <label for="rei">Reine</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>&nbsp;Fruits....&nbsp;</legend>
            <p>Quels sont vos fruits préférés ? (plusieurs choix possibles)</p>
            <div class="item_fruit">
                <input type="checkbox" id="frai" name="frai_rqt" >
                <label for="frai">Fraises</label>
            </div>
            <div class="item_fruit">
                <input type="checkbox" id="framb" name="framb_rqt">
                <label for="framb">Framboises</label>
            </div>
            <div class="item_fruit">
                <input type="checkbox" id="myrt" name="myrt_rqt">
                <label for="myrt">Myrtilles</label>
            </div>
        </fieldset>
        <div class="champ">
            <input type="submit" value="Envoyer">
        </div>
    </form>
</body>
